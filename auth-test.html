<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Auth Test</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050816;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            width: min(90%, 500px);
            padding: 35px;
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.2);
        }

        h1 {
            margin-top: 0;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
        }
    </style>
</head>

<body>

<div class="box">
    <h1>🌌 Gravity × M11</h1>
    <p>اختبار نظام الحسابات</p>

    <div id="status">
        جاري الاتصال...
    </div>
</div>

<script src="supabase.js"></script>
<script src="auth.js"></script>

<script>
(async function () {

    const status = document.getElementById("status");

    try {
        await window.gravitySupabaseReady;

        const user = await window.gravityAuth.getCurrentUser();

        if (!user) {
            status.textContent = "✅ الاتصال بـ Supabase ناجح — لا يوجد مستخدم مسجل دخول حاليًا.";
            return;
        }

        const profile = await window.gravityAuth.getProfile();

        status.innerHTML =
            "✅ الاتصال ناجح<br><br>" +
            "👤 الحساب متصل<br>" +
            "🔐 الصلاحية: " +
            (profile?.role || "غير محددة");

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ حصل خطأ في الاتصال. راجع Console.";
    }

})();
</script>

</body>
</html>
