<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gravity | تفاصيل الكتاب</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    font-family:"Cairo",sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(124,58,237,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(34,211,238,.10),
            transparent 30%
        ),
        #050511;
}

.stars{

    position:fixed;
    inset:0;

    pointer-events:none;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.7) 1px,
            transparent 1px
        );

    background-size:110px 110px;

    opacity:.25;
}

.navbar{

    height:75px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 7%;

    border-bottom:
        1px solid rgba(255,255,255,.07);

    background:
        rgba(5,5,17,.75);

    backdrop-filter:blur(18px);

    position:relative;

    z-index:5;
}

.logo{

    color:white;

    text-decoration:none;

    font-size:23px;

    font-weight:900;
}

.back{

    color:#aaaabd;

    text-decoration:none;

    font-size:12px;

    transition:.25s;
}

.back:hover{

    color:white;
}

.container{

    width:min(1000px,90%);

    margin:70px auto;

    position:relative;

    z-index:2;
}

.book{

    display:grid;

    grid-template-columns:300px 1fr;

    gap:45px;

    align-items:center;

    padding:35px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.06),
            rgba(255,255,255,.02)
        );

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 30px 100px rgba(0,0,0,.3);
}

.cover{

    height:420px;

    border-radius:22px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:30px;

    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(167,139,250,.5),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #17132f,
            #0b1830
        );

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 25px 60px rgba(0,0,0,.35);
}

.cover span{

    font-size:26px;

    line-height:1.6;

    font-weight:900;
}

.category{

    color:#67e8f9;

    font-size:12px;

    font-weight:800;

    margin-bottom:10px;
}

h1{

    font-size:40px;

    line-height:1.3;

    margin-bottom:8px;
}

.author{

    color:#a5a6bb;

    font-size:14px;

    margin-bottom:25px;
}

.description{

    color:#999bb0;

    font-size:14px;

    line-height:2.1;

    margin-bottom:30px;
}

.actions{

    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.button{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:13px 22px;

    border-radius:13px;

    text-decoration:none;

    color:white;

    font-family:inherit;

    font-size:12px;

    font-weight:800;

    border:
        1px solid rgba(255,255,255,.09);

    background:
        rgba(255,255,255,.04);

    transition:.25s;
}

.button.primary{

    border:0;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #0891b2
        );
}

.button:hover{

    transform:translateY(-3px);

}

.notice{

    margin-top:20px;

    padding:15px;

    border-radius:14px;

    color:#85869d;

    font-size:10px;

    line-height:1.8;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid rgba(255,255,255,.06);
}

@media(max-width:750px){

    .book{

        grid-template-columns:1fr;

        padding:22px;

    }

    .cover{

        height:330px;

    }

    h1{

        font-size:30px;

    }

}

</style>

</head>

<body>

<div class="stars"></div>

<nav class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        ✦ Gravity
    </a>

    <a
        href="index.html"
        class="back"
    >
        ← العودة إلى المكتبة
    </a>

</nav>


<main class="container">

    <section class="book">

        <div class="cover">

            <span id="coverTitle">
                Gravity Book
            </span>

        </div>


        <div>

            <div
                class="category"
                id="category"
            >
                كتاب
            </div>


            <h1 id="title">
                الكتاب
            </h1>


            <div
                class="author"
                id="author"
            >
                المؤلف
            </div>


            <div
                class="description"
                id="description"
            >
                تفاصيل الكتاب.
            </div>


            <div class="actions">

                <a
                    id="openBook"
                    href="#"
                    target="_blank"
                    rel="noopener"
                    class="button primary"
                >
                    فتح المصدر القانوني
                </a>


                <a
                    href="index.html"
                    class="button"
                >
                    العودة للمكتبة
                </a>

            </div>


            <div class="notice">

                Gravity تعرض روابط لمصادر الكتب القانونية
                والمفتوحة. حقوق المحتوى تعود لأصحابها
                ومصادره الأصلية.

            </div>

        </div>

    </section>

</main>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const title =
    params.get("title");

const author =
    params.get("author");

const category =
    params.get("category");

const description =
    params.get("description");

const url =
    params.get("url");


if(title){

    document
        .getElementById("title")
        .textContent = title;

    document
        .getElementById("coverTitle")
        .textContent = title;

}


if(author){

    document
        .getElementById("author")
        .textContent = author;

}


if(category){

    document
        .getElementById("category")
        .textContent = category;

}


if(description){

    document
        .getElementById("description")
        .textContent = description;

}


if(url){

    document
        .getElementById("openBook")
        .href = url;

}

</script>

</body>

  </html>
