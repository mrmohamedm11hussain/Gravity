<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول — Gravity × M11</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Tahoma, Arial, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 20% 20%, rgba(124, 58, 237, .25), transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(6, 182, 212, .18), transparent 30%),
                #030712;
        }

        .stars,
        .stars::before,
        .stars::after {
            position: fixed;
            inset: 0;
            content: "";
            pointer-events: none;
        }

        .stars {
            background-image:
                radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1px);
            background-size: 70px 70px;
            opacity: .35;
            animation: starsMove 20s linear infinite;
        }

        .stars::before {
            background-image:
                radial-gradient(circle, rgba(255,255,255,.55) 1px, transparent 1px);
            background-size: 110px 110px;
            transform: translate(-30px, -20px);
        }

        @keyframes starsMove {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(70px);
            }
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            position: relative;
            z-index: 2;
        }

        .login-card {
            width: min(460px, 100%);
            padding: 34px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(10, 15, 35, .82);
            backdrop-filter: blur(22px);
            box-shadow:
                0 30px 80px rgba(0,0,0,.55),
                0 0 70px rgba(99,102,241,.12);
            animation: cardIn .8s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .planet {
            width: 105px;
            height: 105px;
            margin: 0 auto 18px;
            border-radius: 50%;
            position: relative;
            background:
                radial-gradient(circle at 30% 25%, #a78bfa, transparent 8%),
                radial-gradient(circle at 65% 65%, #0891b2, transparent 18%),
                linear-gradient(135deg, #312e81, #06b6d4);
            box-shadow:
                0 0 35px rgba(99,102,241,.6),
                inset -15px -12px 30px rgba(0,0,0,.45);
            animation: planetFloat 4s ease-in-out infinite;
        }

        .planet::after {
            content: "";
            position: absolute;
            width: 145px;
            height: 35px;
            border: 2px solid rgba(167,139,250,.8);
            border-radius: 50%;
            top: 35px;
            left: -20px;
            transform: rotate(-18deg);
            box-shadow: 0 0 15px rgba(103,232,249,.3);
        }

        @keyframes planetFloat {
            0%, 100% {
                transform: translateY(0) rotate(-3deg);
            }
            50% {
                transform: translateY(-9px) rotate(3deg);
            }
        }

        .brand h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: .5px;
        }

        .brand p {
            color: #a5b4fc;
            margin: 9px 0 0;
            font-size: 14px;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 5px;
            border-radius: 15px;
            background: rgba(255,255,255,.05);
            margin-bottom: 22px;
        }

        .tab {
            border: 0;
            border-radius: 11px;
            padding: 12px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 15px;
        }

        .tab.active {
            color: white;
            background: rgba(99,102,241,.35);
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .field input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.1);
            outline: none;
            color: white;
            background: rgba(255,255,255,.055);
            font-size: 15px;
            transition: .25s;
        }

        .field input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129,140,248,.1);
        }

        .submit {
            width: 100%;
            border: 0;
            border-radius: 15px;
            padding: 15px;
            margin-top: 5px;
            color: white;
            background: linear-gradient(135deg, #7c3aed, #0891b2);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
        }

        .submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(79,70,229,.25);
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            background: rgba(255,255,255,.06);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="stars"></div>

<main class="page">

    <section class="login-card">

        <div class="brand">
            <div class="planet"></div>

            <h1>Gravity</h1>

            <p>المعرفة بلا حدود · M11</p>
        </div>

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                type="button">
                تسجيل الدخول
            </button>

            <button
                class="tab"
                id="signupTab"
                type="button">
                إنشاء حساب
            </button>

        </div>

        <form id="authForm">

            <div
                class="field hidden"
                id="nameField">

                <label for="fullName">
                    الاسم الكامل
                </label>

                <input
                    id="fullName"
                    type="text"
                    placeholder="اكتب اسمك">
            </div>

            <div class="field">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required>
            </div>

            <div class="field">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="كلمة المرور"
                    required>
            </div>

            <button
                class="submit"
                id="submitButton"
                type="submit">

                دخول إلى Gravity 🚀

            </button>

        </form>

        <div
            class="message"
            id="message">
        </div>

        <a
            class="back"
            href="index.html">
            ← العودة إلى المكتبة
        </a>

    </section>

</main>

<script src="supabase.js"></script>
<script src="auth.js"></script>

<script>

let mode = "login";

const loginTab =
    document.getElementById("loginTab");

const signupTab =
    document.getElementById("signupTab");

const nameField =
    document.getElementById("nameField");

const submitButton =
    document.getElementById("submitButton");

const authForm =
    document.getElementById("authForm");

const message =
    document.getElementById("message");

function showMessage(text) {

    message.textContent = text;
    message.style.display = "block";
}

function setMode(newMode) {

    mode = newMode;

    if (mode === "login") {

        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        nameField.classList.add("hidden");

        submitButton.textContent =
            "دخول إلى Gravity 🚀";

    } else {

        signupTab.classList.add("active");
        loginTab.classList.remove("active");

        nameField.classList.remove("hidden");

        submitButton.textContent =
            "إنشاء حساب 🚀";
    }

    message.style.display = "none";
}

loginTab.addEventListener("click", () => {
    setMode("login");
});

signupTab.addEventListener("click", () => {
    setMode("signup");
});

authForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    message.style.display = "none";

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const fullName =
        document.getElementById("fullName").value.trim();

    submitButton.disabled = true;

    submitButton.textContent =
        "جاري الاتصال بالمدار...";

    try {

        await window.gravitySupabaseReady;

        if (mode === "login") {

            await window.gravityAuth.signIn(
                email,
                password
            );

            await window.gravityAuth.createProfileIfNeeded();

            showMessage(
                "تم تسجيل الدخول بنجاح 🚀 جاري فتح Gravity..."
            );

            setTimeout(() => {
                window.location.href = "index.html";
            }, 900);

        } else {

            if (!fullName) {
                throw new Error(
                    "اكتب اسمك الكامل أولًا."
                );
            }

            await window.gravityAuth.signUp(
                email,
                password,
                fullName
            );

            showMessage(
                "تم إنشاء الحساب بنجاح. لو ظهر لك طلب تأكيد البريد، أكّد بريدك ثم سجّل الدخول."
            );

            setMode("login");
        }

    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "حدث خطأ. حاول مرة أخرى."
        );

    } finally {

        submitButton.disabled = false;

        submitButton.textContent =
            mode === "login"
                ? "دخول إلى Gravity 🚀"
                : "إنشاء حساب 🚀";
    }

});

</script>

</body>
  </html>
