<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Gravity — الحساب</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    color: #f8fafc;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(124,58,237,.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(8,145,178,.18),
            transparent 30%
        ),
        #020617;

    overflow-x: hidden;

}


.stars {

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: .55;

    background-image:
        radial-gradient(
            circle at 10% 20%,
            white 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle at 30% 70%,
            white 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle at 70% 30%,
            white 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle at 90% 80%,
            white 0 1px,
            transparent 1.5px
        );

    background-size:
        250px 250px,
        330px 330px,
        410px 410px,
        300px 300px;

}


.panel {

    width:
        min(460px, 100%);

    padding:
        32px;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:
        28px;

    background:
        rgba(8,13,30,.82);

    backdrop-filter:
        blur(22px);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.4);

}


.logo {

    width: 65px;
    height: 65px;

    margin:
        0 auto 18px;

    display: grid;

    place-items: center;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #2563eb,
            #0891b2
        );

    box-shadow:
        0 0 45px
        rgba(124,58,237,.35);

}


.logo::after {

    content: "";

    width: 23px;
    height: 23px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 20px
        white;

}


h1 {

    text-align: center;

    font-size: 30px;

    margin-bottom: 7px;

}


.subtitle {

    text-align: center;

    color: #64748b;

    font-size: 13px;

    margin-bottom: 25px;

}


.tabs {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;

    margin-bottom: 22px;

}


.tab {

    min-height: 44px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 12px;

    color: #94a3b8;

    background:
        rgba(255,255,255,.03);

    cursor: pointer;

    font-family: inherit;

}


.tab.active {

    color: white;

    border-color:
        rgba(139,92,246,.45);

    background:
        rgba(124,58,237,.18);

}


.field {

    margin-bottom: 14px;

}


label {

    display: block;

    margin-bottom: 7px;

    color: #cbd5e1;

    font-size: 12px;

}


input {

    width: 100%;

    height: 49px;

    padding:
        0 14px;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 13px;

    color: white;

    background:
        rgba(255,255,255,.035);

    font-family: inherit;

}


input:focus {

    border-color:
        rgba(139,92,246,.65);

    box-shadow:
        0 0 0 4px
        rgba(124,58,237,.08);

}


.submit {

    width: 100%;

    min-height: 51px;

    margin-top: 8px;

    border: 0;

    border-radius: 14px;

    color: white;

    font-weight: bold;

    font-family: inherit;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #2563eb,
            #0891b2
        );

    cursor: pointer;

    box-shadow:
        0 12px 30px
        rgba(79,70,229,.25);

}


.submit:disabled {

    opacity: .6;

    cursor: wait;

}


.message {

    display: none;

    margin-top: 15px;

    padding: 13px;

    border-radius: 13px;

    font-size: 12px;

    line-height: 1.8;

}


.message.show {
    display: block;
}


.message.error {

    color: #fecaca;

    background:
        rgba(127,29,29,.25);

    border:
        1px solid
        rgba(248,113,113,.18);

}


.message.success {

    color: #bbf7d0;

    background:
        rgba(20,83,45,.25);

    border:
        1px solid
        rgba(74,222,128,.18);

}


.resend {

    display: none;

    width: 100%;

    min-height: 44px;

    margin-top: 10px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 12px;

    color: #c4b5fd;

    background:
        rgba(124,58,237,.07);

    cursor: pointer;

    font-family: inherit;

}


.resend.show {
    display: block;
}


.back {

    display: block;

    margin-top: 22px;

    text-align: center;

    color: #64748b;

    text-decoration: none;

    font-size: 12px;

}


.back:hover {
    color: white;
}


</style>

</head>


<body>

<div class="stars"></div>


<main class="panel">

    <div class="logo"></div>


    <h1>
        GRAVITY
    </h1>


    <div class="subtitle">
        حسابك الشخصي في مدار المعرفة
    </div>


    <div class="tabs">

        <button
            class="tab active"
            id="loginTab"
            type="button"
        >
            تسجيل الدخول
        </button>


        <button
            class="tab"
            id="signupTab"
            type="button"
        >
            إنشاء حساب
        </button>

    </div>


    <form id="authForm">

        <div
            class="field"
            id="nameField"
            style="display:none"
        >

            <label>
                الاسم
            </label>

            <input
                id="nameInput"
                type="text"
                autocomplete="name"
                placeholder="اكتب اسمك"
            >

        </div>


        <div class="field">

            <label>
                البريد الإلكتروني
            </label>

            <input
                id="emailInput"
                type="email"
                autocomplete="email"
                placeholder="example@email.com"
                required
            >

        </div>


        <div class="field">

            <label>
                كلمة المرور
            </label>

            <input
                id="passwordInput"
                type="password"
                autocomplete="current-password"
                placeholder="6 أحرف أو أكثر"
                required
            >

        </div>


        <button
            class="submit"
            id="submitButton"
            type="submit"
        >
            تسجيل الدخول
        </button>

    </form>


    <div
        class="message"
        id="message"
    ></div>


    <button
        class="resend"
        id="resendButton"
        type="button"
    >
        📧 إعادة إرسال رسالة التأكيد
    </button>


    <a
        href="index.html"
        class="back"
    >
        ← العودة إلى Gravity
    </a>

</main>


<script src="supabase.js?v=20261004"></script>

<script src="auth.js?v=20261004"></script>


<script>

let mode =
    "login";


const loginTab =
    document.getElementById(
        "loginTab"
    );


const signupTab =
    document.getElementById(
        "signupTab"
    );


const nameField =
    document.getElementById(
        "nameField"
    );


const nameInput =
    document.getElementById(
        "nameInput"
    );


const emailInput =
    document.getElementById(
        "emailInput"
    );


const passwordInput =
    document.getElementById(
        "passwordInput"
    );


const form =
    document.getElementById(
        "authForm"
    );


const submitButton =
    document.getElementById(
        "submitButton"
    );


const message =
    document.getElementById(
        "message"
    );


const resendButton =
    document.getElementById(
        "resendButton"
    );


function setMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

}


function setMode(
    nextMode
) {

    mode =
        nextMode;


    const signup =
        mode ===
        "signup";


    loginTab.classList.toggle(
        "active",
        !signup
    );


    signupTab.classList.toggle(
        "active",
        signup
    );


    nameField.style.display =
        signup
            ? "block"
            : "none";


    passwordInput.autocomplete =
        signup
            ? "new-password"
            : "current-password";


    submitButton.textContent =
        signup
            ? "🚀 إنشاء الحساب"
            : "🚀 تسجيل الدخول";


    message.className =
        "message";


    resendButton.classList.remove(
        "show"
    );

}


loginTab.addEventListener(
    "click",
    () =>
        setMode("login")
);


signupTab.addEventListener(
    "click",
    () =>
        setMode("signup")
);


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        const name =
            nameInput.value.trim();


        if (!email) {

            setMessage(
                "اكتب البريد الإلكتروني.",
                "error"
            );

            return;

        }


        if (
            password.length < 6
        ) {

            setMessage(
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
                "error"
            );

            return;

        }


        if (
            mode === "signup" &&
            !name
        ) {

            setMessage(
                "اكتب اسمك.",
                "error"
            );

            return;

        }


        submitButton.disabled =
            true;


        submitButton.textContent =
            "⏳ جاري التنفيذ...";


        try {

            if (
                mode === "signup"
            ) {

                const result =
                    await window.gravityAuth
                        .signUp(
                            email,
                            password,
                            name
                        );


                if (
                    result.needsEmailConfirmation
                ) {

                    setMessage(
                        "تم إنشاء الحساب. افتح رسالة التأكيد التي أرسلناها إلى بريدك الإلكتروني ثم ارجع وسجّل الدخول.",
                        "success"
                    );


                    resendButton.classList.add(
                        "show"
                    );


                    return;

                }


                setMessage(
                    "تم إنشاء الحساب بنجاح. جاري الدخول...",
                    "success"
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "index.html";

                    },
                    700
                );


                return;

            }


            await window.gravityAuth
                .signIn(
                    email,
                    password
                );


            setMessage(
                "تم تسجيل الدخول بنجاح 🚀",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                500
            );

        } catch (error) {

            console.error(
                "Gravity Auth:",
                error
            );


            let text =
                error?.message ||
                "حدث خطأ غير متوقع.";


            if (
                text.includes(
                    "Invalid login credentials"
                )
            ) {

                text =
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }


            if (
                text.includes(
                    "Email not confirmed"
                )
            ) {

                text =
                    "الحساب موجود، لكن البريد الإلكتروني لم يتم تأكيده بعد.";

                resendButton.classList.add(
                    "show"
                );

            }


            setMessage(
                text,
                "error"
            );

        } finally {

            submitButton.disabled =
                false;


            submitButton.textContent =
                mode === "signup"
                    ? "🚀 إنشاء الحساب"
                    : "🚀 تسجيل الدخول";

        }

    }
);


resendButton.addEventListener(
    "click",
    async function() {

        try {

            const email =
                emailInput.value.trim();


            if (!email) {

                setMessage(
                    "اكتب بريدك الإلكتروني أولًا.",
                    "error"
                );

                return;

            }


            resendButton.disabled =
                true;


            await window.gravityAuth
                .resendConfirmation(
                    email
                );


            setMessage(
                "تم إرسال رسالة تأكيد جديدة. افحص بريدك الإلكتروني.",
                "success"
            );

        } catch (error) {

            setMessage(
                error?.message ||
                "تعذر إعادة إرسال الرسالة.",
                "error"
            );

        } finally {

            resendButton.disabled =
                false;

        }

    }
);


(async function() {

    try {

        const user =
            await window.gravityAuth
                .getCurrentUser();


        if (user) {

            setMessage(
                "أنت مسجل الدخول بالفعل. جاري فتح حسابك...",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                600
            );

        }

    } catch {

        // لا شيء

    }

})();

</script>

</body>

    </html>
